<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save the Date · Francesca &amp; Jody</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4f0e8; --card:#fbf9f4; --ink:#2f3437; --soft:#6b6f6c; --sage:#6f7f63; --sage-d:#56664c; --line:#e3ddd1; --gold:#b8995a; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--paper); color:var(--ink); }
  body { font-family:"EB Garamond", Georgia, serif; -webkit-font-smoothing:antialiased; }
  main { max-width:460px; margin:0 auto; padding:28px 20px 48px; text-align:center; }
  .film { position:relative; margin:0 auto; width:100%; max-width:330px; aspect-ratio:9/16; border-radius:14px; overflow:hidden;
          background:#ece7dd; box-shadow:0 18px 40px -22px rgba(60,50,30,.45), 0 2px 6px rgba(60,50,30,.08); }
  .film video { width:100%; height:100%; display:block; object-fit:cover; }
  .sound { position:absolute; right:10px; bottom:10px; border:0; border-radius:999px; padding:7px 13px; font:500 13px/1 "EB Garamond",serif;
           letter-spacing:.06em; background:rgba(251,249,244,.88); color:var(--ink); cursor:pointer; backdrop-filter:blur(4px); }
  .eyebrow { margin:34px 0 4px; font-size:13px; letter-spacing:.32em; text-transform:uppercase; color:var(--soft); }
  h1 { margin:0; font-family:"Great Vibes", cursive; font-weight:400; font-size:54px; line-height:1.15; color:var(--sage-d); }
  .date { margin:10px 0 4px; font-size:19px; letter-spacing:.16em; text-transform:uppercase; font-weight:500; }
  .place { margin:0; font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); }
  .note { margin:14px 0 0; font-style:italic; color:var(--soft); font-size:17px; }
  .rule { width:56px; height:1px; background:var(--gold); opacity:.7; margin:30px auto 26px; border:0; }
  h2 { margin:0 0 16px; font-size:13px; letter-spacing:.32em; text-transform:uppercase; font-weight:500; color:var(--ink); }
  .cal { display:grid; grid-template-columns:1fr; gap:10px; }
  .cal a { display:flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 12px; border-radius:10px;
           border:1px solid var(--line); background:var(--card); color:var(--ink); text-decoration:none; font-size:17px; transition:border-color .15s, transform .15s; }
  .cal a:hover { border-color:var(--sage); transform:translateY(-1px); }
  .cal a:focus-visible { outline:2px solid var(--sage); outline-offset:2px; }
  .cal svg { width:18px; height:18px; flex:none; }
  .fine { margin:14px 0 0; font-size:14px; color:var(--soft); line-height:1.45; }
  .venue { color:var(--sage-d); }
</style>
</head>
<body>
<main>
  <div class="film">
    <video id="v" src="save-the-date.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto" aria-label="Save the date film for Francesca and Jody"></video>
    <button class="sound" id="snd" type="button" aria-pressed="false">Sound on</button>
  </div>

  <p class="eyebrow">Save the date</p>
  <h1>Francesca &amp; Jody</h1>
  <p class="date">Saturday 10th July 2027</p>
  <p class="place">Farbridge, nr Chichester<br>England</p>
  <p class="note">Invitation to follow</p>

  <hr class="rule">

  <h2>Add to your calendar</h2>
  <div class="cal">
    <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Francesca%20%26%20Jody%27s%20Wedding&amp;dates=20270710/20270711&amp;details=Save%20the%20date%21%20Francesca%20%26%20Jody%20are%20getting%20married%20on%20Saturday%2010th%20July%202027%20at%20Farbridge%2C%20near%20Chichester.%20Invitation%20to%20follow.&amp;location=Farbridge%2C%20West%20Dean%2C%20Chichester%2C%20West%20Sussex%20PO18%200JT%2C%20England" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.6z"/><path fill="#34A853" d="M12 22.5c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.7A10.5 10.5 0 0 0 12 22.5z"/><path fill="#FBBC05" d="M6.2 14.1a6.3 6.3 0 0 1 0-4V7.4H2.7a10.5 10.5 0 0 0 0 9.4l3.5-2.7z"/><path fill="#EA4335" d="M12 5.7c1.5 0 2.9.5 4 1.5l3-3A10.5 10.5 0 0 0 2.7 7.4l3.5 2.7C7 7.6 9.3 5.7 12 5.7z"/></svg>
      Google</a>
    <a href="https://outlook.live.com/calendar/0/action/compose?allday=true&amp;startdt=2027-07-10&amp;enddt=2027-07-11&amp;subject=Francesca%20%26%20Jody%27s%20Wedding&amp;location=Farbridge%2C%20West%20Dean%2C%20Chichester%2C%20West%20Sussex%20PO18%200JT%2C%20England&amp;body=Save%20the%20date%21%20Francesca%20%26%20Jody%20are%20getting%20married%20on%20Saturday%2010th%20July%202027%20at%20Farbridge%2C%20near%20Chichester.%20Invitation%20to%20follow.&amp;path=%2Fcalendar%2Faction%2Fcompose&amp;rru=addevent" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="12" height="16" rx="2" fill="#0F6CBD"/><ellipse cx="8" cy="12" rx="3" ry="3.6" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M14 7h7a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-7z" fill="#28A8EA"/></svg>
      Outlook.com</a>
    <a href="https://outlook.office.com/calendar/0/action/compose?allday=true&amp;startdt=2027-07-10&amp;enddt=2027-07-11&amp;subject=Francesca%20%26%20Jody%27s%20Wedding&amp;location=Farbridge%2C%20West%20Dean%2C%20Chichester%2C%20West%20Sussex%20PO18%200JT%2C%20England&amp;body=Save%20the%20date%21%20Francesca%20%26%20Jody%20are%20getting%20married%20on%20Saturday%2010th%20July%202027%20at%20Farbridge%2C%20near%20Chichester.%20Invitation%20to%20follow.&amp;path=%2Fcalendar%2Faction%2Fcompose&amp;rru=addevent" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="#0F6CBD" stroke-width="1.8"/><path d="M3 9.5h18M8 3v4M16 3v4" stroke="#0F6CBD" stroke-width="1.8" stroke-linecap="round"/><rect x="7" y="12.5" width="4" height="3.5" rx=".6" fill="#0F6CBD"/></svg>
      Outlook 365</a>
  </div>
  <p class="fine">Using Apple Calendar? Tap the calendar invite attached to our message.<br>
  <span class="venue">Farbridge, West Dean, Chichester, West Sussex PO18 0JT</span></p>
</main>
<script>
  (function () {
    var v = document.getElementById('v'), b = document.getElementById('snd');
    b.addEventListener('click', function () {
      v.muted = !v.muted;
      if (!v.muted) { try { v.currentTime = 0; var p = v.play(); if (p && p.catch) p.catch(function(){}); } catch (e) {} }
      b.textContent = v.muted ? 'Sound on' : 'Sound off';
      b.setAttribute('aria-pressed', String(!v.muted));
    });
  })();
</script>
</body>
</html>
